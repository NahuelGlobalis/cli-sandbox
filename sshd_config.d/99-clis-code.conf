# Acceso remoto únicamente por clave pública. La conectividad se limita al
# tailnet mediante el sidecar de Tailscale definido en docker-compose.yml.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PermitRootLogin no
PubkeyAuthentication yes
AllowUsers dev

# SSH y Mosh no heredan el ENV de la imagen. Exponer las mismas rutas que usa
# el contenedor local permite ejecutar las CLIs en sesiones remotas.
SetEnv PATH=/opt/herdr/bin:/home/dev/.local/bin:/opt/pnpm-global/bin:/opt/antigravity/bin:/opt/devin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

# Moshi usa forwarding local para Chat View, diffs y browser preview.
AllowTcpForwarding yes
GatewayPorts no
X11Forwarding no

ClientAliveInterval 60
ClientAliveCountMax 3
UseDNS no

# Las claves se generan al arrancar y viven en un volumen persistente.
HostKey /var/lib/ssh/ssh_host_ed25519_key
HostKey /var/lib/ssh/ssh_host_ecdsa_key
HostKey /var/lib/ssh/ssh_host_rsa_key
