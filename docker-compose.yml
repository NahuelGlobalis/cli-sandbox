services:
  tailscale:
    image: tailscale/tailscale:stable
    container_name: clis-tailscale
    hostname: ${TAILSCALE_HOSTNAME:-clis-code}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?Define TS_AUTHKEY en .env}
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_USERSPACE: "false"
      TS_ACCEPT_DNS: "true"
      TS_HOSTNAME: ${TAILSCALE_HOSTNAME:-clis-code}
    volumes:
      - tailscale-state:/var/lib/tailscale
      - tailscale-socket:/var/run/tailscale
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    healthcheck:
      test: ["CMD-SHELL", "tailscale status --json | grep -q '\"BackendState\":[[:space:]]*\"Running\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    # Moshi Desktop (web UI 24544) corre en clis-code, pero comparte este
    # namespace de red. Publicar aqui el puerto es la unica forma de exponerlo
    # cuando el host no esta en el tailnet. Se vincula a 127.0.0.1 para no
    # exponerlo a la LAN: solo el host puede alcanzarlo.
    ports:
      - "127.0.0.1:24544:24544"
    restart: unless-stopped

  clis-code:
    # La imagen contiene Google Chrome y CLIs que solo distribuyen amd64.
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      args:
        IMAGE_VERSION: ${IMAGE_VERSION:-dev}
    image: clis-code:latest
    container_name: clis-code
    # SSH y Mosh quedan accesibles mediante la IP/MagicDNS del tailnet, sin
    # publicar puertos en Internet.
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_healthy
    # Manejo correcto de señales (Ctrl+C, zombies)
    init: true
    # Reiniciar a menos que se haya detenido manualmente
    restart: unless-stopped
    stdin_open: true
    tty: true
    # Antigravity puede requerir seccomp:unconfined y SYS_PTRACE en algunos
    # entornos. No se habilitan por defecto; añádelos solo si agy falla.
    environment:
      - HOME=/home/dev
      - XDG_DATA_HOME=/home/dev/.local/share
      - TZ=UTC
      - TAILSCALE_SOCKET=/var/run/tailscale/tailscaled.sock
      # El entrypoint arranca un ssh-agent interno en /tmp/clis-ssh-agent.sock y
      # carga las claves del host desde /home/dev/.git-ssh. Así Git por SSH no
      # depende del agent del host y no se monta ~/.ssh sobre /home/dev/.ssh
      # (lo que ocultaría el authorized_keys persistente de Easy Pair/Moshi).
      - SSH_AUTH_SOCK=/tmp/clis-ssh-agent.sock
      - MOSHI_HOOK_AUTOSTART=1
      # Git: identidad (sobreescribe .gitconfig del host sin modificarlo)
      - GIT_AUTHOR_NAME=nahuel.cano
      - GIT_AUTHOR_EMAIL=nahuelcano@gmail.com
      - GIT_COMMITTER_NAME=nahuel.cano
      - GIT_COMMITTER_EMAIL=nahuelcano@gmail.com
    volumes:
      # Docker: montar el socket del host para usar el daemon desde dentro
      - /var/run/docker.sock:/var/run/docker.sock
      # Claves SSH del host en un volumen separado y de solo lectura. El
      # entrypoint carga las privadas en un ssh-agent interno; así no se monta
      # ~/.ssh sobre /home/dev/.ssh y el authorized_keys de Moshi se conserva.
      - ${HOME}/.ssh:/home/dev/.git-ssh:ro
      # Home completo: persiste configs, credenciales y la authorized_keys que
      # Easy Pair crea para el celular.
      - ${HOME}/.clis-code/home:/home/dev
      - tailscale-socket:/var/run/tailscale
      - ssh-host-keys:/var/lib/ssh
      # Skills compartidas con el host en lectura y escritura.
      - ${HOME}/.agents/skills:/home/dev/.agents/skills
      # Git se comparte en modo lectura. ~/.ssh del host se monta como .git-ssh
      # (arriba) y se carga en el agent interno; nunca sobre /home/dev/.ssh.
      - ${HOME}/.gitconfig:/home/dev/.gitconfig:ro
      - ${HOME}/.git-credentials:/home/dev/.git-credentials:ro
      # Todos los repos comparten la misma ruta en sesiones locales y remotas.
      - ${CLIS_PROJECTS_ROOT:-/mnt/c/dev}:/home/dev/projects
    command: ["sleep", "infinity"]

volumes:
  tailscale-state:
  tailscale-socket:
  ssh-host-keys:
